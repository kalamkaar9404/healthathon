[project]
name = "cancercare"
version = "0.1.0"
description = "Turning the paper a cancer patient carries into a structured, clinician-confirmed treatment record."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
pii = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
dev = ["pytest>=8.0"]

[tool.vercel]
entrypoint = "backend.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
